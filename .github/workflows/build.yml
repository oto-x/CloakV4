name: Build CloakV4 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext cmake ninja-build build-essential curl unzip zip openjdk-17-jre-headless

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        link-to-sdk: true

    - name: Download Dependencies & Build APK
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cd android
        chmod +x gradlew
        if [ -f "download_deps.sh" ]; then
          chmod +x download_deps.sh
          ./download_deps.sh || true
        fi
        ./gradlew assembleDebug -PabiFilters=arm64-v8a --stacktrace

    - name: Patch Native Libraries, ZipAlign & Sign APK
      run: |
        # Locate absolute path of APK
        APK_FILE=$(realpath $(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1))
        echo "Target APK Path: $APK_FILE"
        
        # Unpack
        mkdir -p /tmp/apk_patch
        unzip -q "$APK_FILE" -d /tmp/apk_patch
        
        # Duplicate .so libraries so launcher can find them
        LIB_DIR="/tmp/apk_patch/lib/arm64-v8a"
        if [ -d "$LIB_DIR" ]; then
          cd "$LIB_DIR"
          if [ -f "libcloakv4.so" ]; then
            cp libcloakv4.so libluanti.so
            cp libcloakv4.so libminetest.so
            cp libcloakv4.so libmain.so
          fi
        fi
        
        # Remove old Gradle build signature manifests
        rm -rf /tmp/apk_patch/META-INF
        
        # Repackage into unaligned APK
        cd /tmp/apk_patch
        zip -r -q /tmp/unaligned.apk .
        
        # Locate Android SDK Build Tools (zipalign & apksigner)
        BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
        
        # Align APK zip entries to 4-byte boundaries
        $BUILD_TOOLS_DIR/zipalign -v -p 4 /tmp/unaligned.apk /tmp/aligned.apk
        
        # Create temporary debug keystore and sign the modified APK
        keytool -genkeypair -v -keystore /tmp/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        $BUILD_TOOLS_DIR/apksigner sign --ks /tmp/debug.keystore --ks-pass pass:android --key-pass pass:android --out "$APK_FILE" /tmp/aligned.apk
        
        echo "Successfully patched, aligned, and signed APK."

    - name: Upload ARM64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CloakV4-ARM64-Debug
        path: android/app/build/outputs/apk/debug/*.apk
