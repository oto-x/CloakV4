name: Build CloakV4 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext cmake ninja-build build-essential curl unzip zip

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        link-to-sdk: true

    - name: Download Dependencies & Build APK
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cd android
        chmod +x gradlew
        if [ -f "download_deps.sh" ]; then
          chmod +x download_deps.sh
          ./download_deps.sh || true
        fi
        ./gradlew assembleDebug -PabiFilters=arm64-v8a --stacktrace

    - name: Patch Native Libraries in APK
      run: |
        # Get absolute path to target APK
        APK_FILE=$(realpath $(find android/app/build/outputs/apk/debug/ -name "*.apk" | head -n 1))
        echo "Target APK Absolute Path: $APK_FILE"
        
        # Unpack APK
        mkdir -p /tmp/apk_patch
        unzip -q "$APK_FILE" -d /tmp/apk_patch
        
        # Duplicate .so libraries
        LIB_DIR="/tmp/apk_patch/lib/arm64-v8a"
        if [ -d "$LIB_DIR" ]; then
          cd "$LIB_DIR"
          if [ -f "libcloakv4.so" ]; then
            cp libcloakv4.so libluanti.so
            cp libcloakv4.so libminetest.so
            cp libcloakv4.so libmain.so
          fi
          echo "Updated binaries in lib/arm64-v8a:"
          ls -la
        fi
        
        # Repackage APK directly back to original absolute path
        cd /tmp/apk_patch
        zip -r -q "$APK_FILE" .

    - name: Upload ARM64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CloakV4-ARM64-Debug
        path: android/app/build/outputs/apk/debug/*.apk
