name: Build CloakV4 Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository with Submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install System Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gettext cmake ninja-build build-essential

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r21e
        link-to-sdk: true

    - name: Build ARM64 Native Binaries & APK
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug -PabiFilters=arm64-v8a --stacktrace

    - name: Upload ARM64 APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CloakV4-ARM64-Debug
        path: android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
